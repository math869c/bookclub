<head>

            max-width: 600px;

        }

</head>

<body>
    <!-- ################################################################################################ -->
    <!-- ################################################################################################ -->
    <!-- ################################################################################################ -->
    <div class="wrapper row2">
        <nav id="mainav" class="hoc clear">
            <button class="mobile-nav-toggle" aria-expanded="false" aria-controls="main-menu">
                Oversigt
            </button>
            <!-- ################################################################################################ -->
            <ul class="clear" id="main-menu">
                <li class="active"><a href="index.html">Forside</a></li>
                <li><a href="books.html">Vores Bøger</a></li>
                <li class="has-submenu">
                    <button type="button" class="submenu-toggle" aria-expanded="false">
                        Yndlings Bøger
                    </button>
                    <ul class="submenu">
                        <li><a href="books/de_bedste.html">Højeste Ratings</a></li>
                        <li><a href="books/nikolajs_yndlings.html">Nikolaj</a></li>
                        <li><a href="books/Tokes_yndlings.html">Toke</a></li>
                        <li><a href="books/Marius_yndlings.html">Marius</a></li>
                        <li><a href="books/Mathias_yndlings.html">Mathias</a></li>
                        <li><a href="books/Olivers_yndlings.html">Oliver</a></li>
                    </ul>
                </li>
                <li class="has-submenu">
                    <button type="button" class="submenu-toggle" aria-expanded="false">
                        Bøger Valgt Af
                    </button>
                    <ul class="submenu">
                        <li><a href="personer/Nikolaj.html">Nikolaj</a></li>
                        <li><a href="personer/Toke.html">Toke</a></li>
                        <li><a href="personer/Marius.html">Marius</a></li>
                        <li><a href="personer/Mathias.html">Mathias</a></li>
                        <li><a href="personer/Oliver.html">Oliver</a></li>
                    </ul>
                </li>
            </ul>
            <!-- ################################################################################################ -->
        </nav>
    </div>
    <!-- ################################################################################################ -->
    <!-- ################################################################################################ -->
    <!-- ################################################################################################ -->

    <!-- Book List Section -->
    <div class="wrapper row4">
        <div class="hoc container clear">
            <h2 class="center btmspace-80">Bøger vi har læst</h2>
            <ul id="book-list" class="book-grid nospace elements">
                <!-- Books load here -->
            </ul>
            <div class="clear"></div>
        </div>
    </div>

    <!-- Footer -->
    <div class="wrapper row5">
        <div id="copyright" class="hoc clear">
            <p class="fl_left">Copyright &copy; 2025 - All Rights Reserved - Pedggie</p>
        </div>
    </div>

    <!-- JS: Load books.json and render -->
    <script src="layout/scripts/book_ratings.js"></script>
    <script>
        fetch('data/books.json')
            .then(res => res.json())
            .then(books => {
                const container = document.getElementById('book-list');

                books.forEach(book => {
                    const average = BookRatings.average(book);
                    if (average === null) return;

                    const li = document.createElement('li');
                    li.className = 'full_width';

                    li.innerHTML = `
                    <article class="book-card">
                        <figure>
                        <img src="${book.image}" alt="${book.title}" class="uniform-book-image">
                        <figcaption><a href="books_html/${book.html_link}">${book.title} &raquo;</a></figcaption>
                        </figure>
                        <div class="txtwrap">
                        <h6 class="heading">${book.title}</h6>
                        <p><strong>Gns. rating:</strong> ${average.toFixed(1)}/10</p>
                        </div>
                    </article>
                    `;

                    container.appendChild(li);
                });
            })
            .catch(error => console.error('Kunne ikke hente bøger:', error));
    </script>
    <!-- ################################################################################################ -->
    <!-- ################################################################################################ -->
    <!-- ################################################################################################ -->
    <a id="backtotop" href="#top"><i class="fa fa-chevron-up"></i></a>

    <script src="layout/scripts/jquery.min.js"></script>
    <script src="layout/scripts/jquery.backtotop.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const button = document.querySelector(".mobile-nav-toggle");
            const menu = document.querySelector("#main-menu");

            if (!button || !menu) return;

            function closeAllSubmenus() {
                menu.querySelectorAll(".submenu-open").forEach(function (item) {
                    item.classList.remove("submenu-open");
                });

                menu.querySelectorAll(".submenu-toggle").forEach(function (toggle) {
                    toggle.setAttribute("aria-expanded", "false");
                });
            }

            function closeMenu() {
                menu.classList.remove("is-open");
                button.setAttribute("aria-expanded", "false");
                closeAllSubmenus();
            }

            function openMenu() {
                menu.classList.add("is-open");
                button.setAttribute("aria-expanded", "true");
            }

            button.addEventListener("click", function () {
                if (menu.classList.contains("is-open")) {
                    closeMenu();
                } else {
                    openMenu();
                }
            });

            // Close menu when a normal link is clicked
            menu.querySelectorAll("a").forEach(function (link) {
                link.addEventListener("click", function () {
                    closeMenu();
                });
            });

            // Optional: if you have submenu buttons, only one stays open at a time
            menu.querySelectorAll(".submenu-toggle").forEach(function (toggle) {
                toggle.addEventListener("click", function (e) {
                    e.preventDefault();

                    const parent = toggle.closest(".has-submenu");
                    const isOpen = parent.classList.contains("submenu-open");

                    closeAllSubmenus();

                    if (!isOpen) {
                        parent.classList.add("submenu-open");
                        toggle.setAttribute("aria-expanded", "true");
                    }
                });
            });
        });
    </script>
</body>

</html>
